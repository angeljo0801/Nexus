name: Build Origen AI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'OrigenAI/**'
      - '.github/workflows/origen-ai.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OrigenAI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - run: node --check app/src/main/assets/sync.js
      - run: node --check app/src/main/assets/pretrained.js
      - run: node tools/test_pretrained.js
      - run: python -m unittest discover -s tools -p "test_dataset_*.py"
      - run: node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('app/src/main/assets/index.html','utf8');for(const m of s.matchAll(/<script>([\\s\\S]*?)<\\/script>/g))new vm.Script(m[1]);"
      - run: node tools/test_model.js
      - name: Test native neural engine
        run: |
          mkdir -p /tmp/origen-native-test
          javac -d /tmp/origen-native-test app/src/main/java/com/origenai/local/NativeModel.java tools/NativeModelTest.java
          java -cp /tmp/origen-native-test com.origenai.local.NativeModelTest
      - name: Compile pinned llama.cpp ARM64 engine (CPU)
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" >/dev/null
          mkdir -p /tmp/origen-llama-upstream
          git -C /tmp/origen-llama-upstream init -q
          git -C /tmp/origen-llama-upstream remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C /tmp/origen-llama-upstream fetch --depth 1 origin 244640b7f26e2a7301b27a24edc4f7feaf97d52f
          git -C /tmp/origen-llama-upstream checkout --detach FETCH_HEAD
          cmake -S app/src/main/cpp -B /tmp/origen-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DORIGEN_LLAMA_SOURCE=/tmp/origen-llama-upstream
          cmake --build /tmp/origen-arm64 --parallel 4 --target origenllama
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/origen-arm64/liborigenllama.so app/src/main/jniLibs/arm64-v8a/
          test -s app/src/main/jniLibs/arm64-v8a/liborigenllama.so
          file app/src/main/jniLibs/arm64-v8a/liborigenllama.so
      - run: gradle :app:assembleDebug
      - name: Sign Origen APK with persistent repository certificate
        env:
          NEXUS_KEYSTORE_B64: ${{ secrets.NEXUS_KEYSTORE_B64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          normalize() {
            local name="$1" raw="$2"
            if printf '%s' "$raw" | grep -q "$name="; then
              printf '%s\n' "$raw" | sed -n "s/^.*${name}[[:space:]]*=[[:space:]]*//p" | head -n 1 | tr -d '\r'
            else
              printf '%s' "$raw" | tr -d '\r'
            fi
          }
          for name in NEXUS_KEYSTORE_B64 NEXUS_KEYSTORE_PASSWORD NEXUS_KEY_ALIAS NEXUS_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret $name"
              exit 1
            fi
          done
          export STORE_PASS="$(normalize NEXUS_KEYSTORE_PASSWORD "$NEXUS_KEYSTORE_PASSWORD")"
          export KEY_PASS="$(normalize NEXUS_KEY_PASSWORD "$NEXUS_KEY_PASSWORD")"
          ALIAS="$(normalize NEXUS_KEY_ALIAS "$NEXUS_KEY_ALIAS")"
          KEYSTORE="$(mktemp)"
          trap 'rm -f "$KEYSTORE"' EXIT
          normalize NEXUS_KEYSTORE_B64 "$NEXUS_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > "$KEYSTORE"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          mkdir -p dist
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out dist/OrigenAI.apk app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose dist/OrigenAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OrigenAI-APK
          path: OrigenAI/dist/OrigenAI.apk
