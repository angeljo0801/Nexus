name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "packages/**"
      - "test/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android platform scaffold exists
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nexus.local .
          fi
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        env:
          NEXUS_GITHUB_CLIENT_ID: ${{ vars.NEXUS_GITHUB_CLIENT_ID }}
        run: >-
          flutter build apk --debug --target-platform android-arm64
          --dart-define=NEXUS_GITHUB_CLIENT_ID=$NEXUS_GITHUB_CLIENT_ID

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
