name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "packages/**"
      - "test/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - ".github/NexusBackupStorageBridge.kt"
      - ".github/NexusMainActivity.kt"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android platform scaffold exists
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nexus.local .
          fi
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          marker='getByName("release") {'
          if marker in s and 'isMinifyEnabled = false' not in s:
              s=s.replace(
                  marker,
                  marker+'\n            isMinifyEnabled = false\n            isShrinkResources = false',
                  1,
              )
          p.write_text(s)
          PY
          mkdir -p android/app/src/main/kotlin/com/nexus/local/nexus
          cp .github/NexusBackupStorageBridge.kt android/app/src/main/kotlin/com/nexus/local/nexus/NexusBackupStorageBridge.kt
          cp .github/NexusMainActivity.kt android/app/src/main/kotlin/com/nexus/local/nexus/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle.kts')
          s=p.read_text()
          s=re.sub(r'namespace\s*=\s*"[^"]+"','namespace = "com.nexus.local.nexus"',s,count=1)
          s=re.sub(r'applicationId\s*=\s*"[^"]+"','applicationId = "com.nexus.local.nexus"',s,count=1)
          p.write_text(s)
          proguard=Path('android/app/proguard-rules.pro')
          rules=proguard.read_text() if proguard.exists() else ''
          extra = (
              "\n# JGit optional desktop/JVM paths are not used on Android.\n"
              "-dontwarn java.lang.ProcessHandle\n"
              "-dontwarn java.lang.management.**\n"
              "-dontwarn javax.management.**\n"
              "-dontwarn org.ietf.jgss.**\n"
          )
          if '-dontwarn javax.management.**' not in rules:
              proguard.write_text(rules+extra)
          # Ensure the release variant consumes the rules even when Flutter's
          # generated Gradle template changes its release block formatting.
          s=p.read_text()
          release_rules='proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
          if release_rules not in s:
              for marker in ('getByName("release") {','release {'):
                  if marker in s:
                      s=s.replace(marker,marker+'\n            '+release_rules,1)
                      break
          p.write_text(s)
          m=Path('android/app/src/main/AndroidManifest.xml')
          x=m.read_text()
          root='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.WRITE_EXTERNAL_STORAGE' not in x:
              x=x.replace(root,root+'\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />',1)
          if 'android.permission.READ_EXTERNAL_STORAGE' not in x:
              x=x.replace(root,root+'\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',1)
          m.write_text(x)
          PY

      - name: Configure stable Android signing
        env:
          NEXUS_KEYSTORE_B64: ${{ secrets.NEXUS_KEYSTORE_B64 }}
          NEXUS_KEYSTORE_PASSWORD: ${{ secrets.NEXUS_KEYSTORE_PASSWORD }}
          NEXUS_KEY_ALIAS: ${{ secrets.NEXUS_KEY_ALIAS }}
          NEXUS_KEY_PASSWORD: ${{ secrets.NEXUS_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$NEXUS_KEYSTORE_B64" ]; then
            printf '%s' "$NEXUS_KEYSTORE_B64" | base64 --decode > android/app/nexus-release.jks
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.nexus.local.nexus"',
              s,
              count=1,
          )
          s = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.nexus.local.nexus"',
              s,
              count=1,
          )

          alias = os.environ.get('NEXUS_KEY_ALIAS', '').strip()
          store_password = os.environ.get('NEXUS_KEYSTORE_PASSWORD', '').strip()
          key_password = os.environ.get('NEXUS_KEY_PASSWORD', '').strip()
          keystore = Path('android/app/nexus-release.jks')

          if keystore.exists() and alias and store_password and key_password:
              def esc(value):
                  return value.replace('\\', '\\\\').replace('"', '\\"')

              block = '''    signingConfigs {
                  create("nexusRelease") {
                      keyAlias = "''' + esc(alias) + '''"
                      keyPassword = "''' + esc(key_password) + '''"
                      storeFile = file("nexus-release.jks")
                      storePassword = "''' + esc(store_password) + '''"
                  }
              }

          '''
              if 'create("nexusRelease")' not in s:
                  s = s.replace('    buildTypes {', block + '    buildTypes {', 1)
              s = re.sub(
                  r'(getByName\("release"\)\s*\{)(.*?)(\n\s*\})',
                  lambda m: (
                      m.group(1)
                      + m.group(2)
                      + '\n            signingConfig = signingConfigs.getByName("nexusRelease")'
                      + m.group(3)
                  ),
                  s,
                  count=1,
                  flags=re.S,
              )

          p.write_text(s)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          NEXUS_GITHUB_CLIENT_ID: ${{ vars.NEXUS_GITHUB_CLIENT_ID }}
        run: >-
          flutter build apk --release --target-platform android-arm64
          --build-number "$GITHUB_RUN_NUMBER"
          --dart-define=NEXUS_GITHUB_CLIENT_ID=$NEXUS_GITHUB_CLIENT_ID

      - name: Record build identity
        env:
          NEXUS_KEYSTORE_B64: ${{ secrets.NEXUS_KEYSTORE_B64 }}
        shell: bash
        run: |
          {
            echo "applicationId=com.nexus.local.nexus"
            echo "buildNumber=$GITHUB_RUN_NUMBER"
            if [ -n "$NEXUS_KEYSTORE_B64" ]; then
              echo "signing=persistent"
            else
              echo "signing=temporary-debug"
              echo "::warning::Nexus todavía no tiene la clave persistente configurada; Android puede rechazar actualizaciones entre builds."
            fi
          } > build/app/outputs/flutter-apk/BUILD_IDENTITY.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-v0.1.1-Backup-Stable-ID-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/BUILD_IDENTITY.txt
