name: nexus_git_bridge
description: Embedded JGit bridge for Nexus Android project workspaces.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.nexus.git
        pluginClass: NexusGitBridgePlugin
